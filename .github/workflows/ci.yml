name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "latest"
          install-go: false

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1 -coverprofile=coverage.out
      - name: Test (race)
        run: go test -race ./internal/bus/... ./internal/event/... ./internal/run/... ./internal/workflow/... ./internal/safety/... ./internal/policy/... ./internal/agent/... ./internal/orchestrator/... ./internal/task/... -count=1
      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.out

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build
        run: go build ./...
      - name: Test (Basic)
        run: go test ./internal/safety/... ./internal/config/... ./internal/run/... -count=1
      - name: CLI Smoke Test
        run: go run ./cmd/prism-cli help

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: 'pip'
          cache-dependency-path: remembrance/pyproject.toml
      - name: Install dependencies
        working-directory: remembrance
        run: python -m pip install -e ".[dev]"
      - name: Test
        working-directory: remembrance
        run: pytest tests/
