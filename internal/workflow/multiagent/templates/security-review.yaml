# security-review.yaml is a shipped example workflow for a security-scan and
# review pipeline: Implementer -> Security Scanner -> Security Reviewer, with
# a correction loop back to the implementer when the reviewer finds issues.
# The loop is unlimited unless its edge has an explicit positive cap, and
# there is a direct escape hatch to human review for anything the
# automated pipeline should never try to resolve on its own (a critical
# finding from the scanner).
#
# Like software-delivery.yaml, implementer/security-scanner/security-reviewer
# form a single cyclic strongly-connected component (implementer ->
# security-scanner -> security-reviewer -> implementer), so — per
# `prism graph validate`'s SCC-wide cycle rule, see
# docs/architecture/decisions/0002-graph-defined-workflows.md — EVERY edge
# among those three nodes needs a `loop:` policy, including the two forward
# edges (implementer -> security-scanner, security-scanner ->
# security-reviewer) that are not corrections. Every edge currently sets
# maxTraversals: -1, so validation has its required policy while traversal is
# unlimited. A workflow author can opt into a finite edge cap with a positive
# value; omitted node and run budgets do not add an implicit loop ceiling.
#
# A note on loop.onExhausted: route_to — the schema accepts it and the
# validator checks it (RouteTo must name a known node and must escape the
# cycle), but as of this release the supervisor's runtime loop-exhaustion
# check (checkLoopBudget in supervisor.go) does not actually consult
# OnExhausted/RouteTo at all: it always ends the run with a budget-exhausted
# error, identical to onExhausted: fail. This template therefore uses
# onExhausted: fail on its correction loop below rather than authoring a
# route_to that would silently not do what it says — see
# docs/workflows/limitations.md and this PR's security review
# (docs/workflows/security.md) for the full finding. A critical finding still
# reaches the "needs-human-review" terminal below via a real routed edge
# (scanner-to-human-review), independently of correction-loop limits.
apiVersion: prism.dev/v1alpha1
kind: MultiAgentWorkflow
metadata:
  name: security-review
  version: "1.0.0"
  description: >-
    Implement a change, scan it for security issues, and route it through a
    security reviewer. Authors may cap the correction loop explicitly; a
    critical finding routes to human review.
  labels:
    category: security
    phase: "3"
spec:
  entryNode: implementer
  budgets:
    maxRetries: 3
    maxDuration: 20m
  defaults:
    failure:
      defaultOnUnhandledOutcome: fail
  nodes:
    - id: implementer
      type: role
      role: implementer
      displayName: Implementer
      description: Implements the change and submits it for a security scan.
      agentProfile: implementer-default
      allowedTools:
        - list_dir
        - read_file
        - search_files
        - project_overview
        - write_file_dry_run
        - apply_patch_proposal
      capabilities:
        - code
      allowedOutcomes:
        - ready_for_scan
      durationBudget: 15m

    - id: security-scanner
      type: role
      role: security-scanner
      displayName: Security Scanner
      description: >-
        Runs automated security scanning against the implementer's latest
        change. A critical finding escapes straight to human review instead
        of entering the (slower, bounded) automated correction loop.
      agentProfile: security-scanner-default
      allowedTools:
        - list_dir
        - read_file
        - search_files
        - project_overview
      capabilities:
        - security-scan
      allowedOutcomes:
        - findings_ready
        - critical_finding
      durationBudget: 10m
      validation:
        profiles:
          - security_scan_clean

    - id: security-reviewer
      type: role
      role: security-reviewer
      displayName: Security Reviewer
      description: Reviews scan findings and either approves or requests fixes.
      agentProfile: security-reviewer-default
      allowedTools:
        - list_dir
        - read_file
        - search_files
        - project_overview
      capabilities:
        - security-review
      allowedOutcomes:
        - approved
        - issues_found
      durationBudget: 10m

    - id: completed
      type: terminal
      displayName: Completed
      terminalCondition: completed

    - id: needs-human-review
      type: terminal
      displayName: Needs Human Review
      terminalCondition: needs_human_review

  edges:
    # Forward edge inside the implementer/scanner/reviewer cycle — see the
    # file-level comment for why this needs a loop policy.
    - id: impl-to-scanner
      from: implementer
      to: security-scanner
      when:
        outcome: ready_for_scan
      loop:
        maxTraversals: -1
        onExhausted: fail
      label: ready for scan

    # Forward edge inside the cycle.
    - id: scanner-to-reviewer
      from: security-scanner
      to: security-reviewer
      when:
        outcome: findings_ready
      loop:
        maxTraversals: -1
        onExhausted: fail
      label: findings ready

    # Real (non-loop-exhaustion) escape: a critical finding never enters the
    # correction loop below — it goes straight to a human. This edge
    # also makes "needs-human-review" statically reachable independently of
    # any author-configured loop limit, so validation reports no unreachable node.
    - id: scanner-to-human-review
      from: security-scanner
      to: needs-human-review
      when:
        outcome: critical_finding
      label: critical finding

    # Genuine correction loop: the reviewer sends findings back to the
    # implementer. The unlimited default can be capped with a positive
    # maxTraversals; onExhausted: fail matches current runtime behavior (see
    # the file-level note above on route_to).
    - id: reviewer-to-impl
      from: security-reviewer
      to: implementer
      when:
        outcome: issues_found
      loop:
        maxTraversals: -1
        onExhausted: fail
      label: issues found

    - id: reviewer-to-completed
      from: security-reviewer
      to: completed
      when:
        outcome: approved
      label: approved
