# software-delivery-happy-path.yaml is a `prism graph test` scenario fixture
# for the shipped templates/software-delivery.yaml workflow: a straight-
# through run with no correction loops taken, plus a run that exercises both
# correction loops once each before finishing successfully.
#
# This file deliberately lives OUTSIDE templates/ (not nested under it):
# `prism graph validate`/`prism graph test` walk a given directory
# recursively and treat every .yaml/.yml/.json file found as, respectively, a
# workflow definition or a scenario fixture — there is no content-based
# disambiguation (confirmed directly against cmd_graph_testcmd_test.go's own
# TestExecuteGraphTestWalksDirectoryRecursively, which documents this same
# convention). Keeping scenario fixtures in a separate directory tree from
# the workflow definitions they exercise means `prism graph validate
# ./templates` never trips over a scenario file, and `prism graph test`
# pointed at this directory never trips over a workflow definition file.
# See docs/workflows/ci-integration.md for the exact CI invocations.
workflow: ../../templates/software-delivery.yaml
scenarios:
  - name: happy-path
    input:
      id: task-happy-path
      description: ship the feature with no correction loops
    script:
      - role: planner
        outcome: plan_ready
      - role: developer
        outcome: implementation_ready
      - role: tester
        outcome: tests_passed
      - role: reviewer
        outcome: review_approved
    expect:
      finalStatus: completed
      terminalNode: "node:terminal:completed"
      transitions:
        - "edge:planner:plan_ready"
        - "edge:developer:implementation_ready"
        - "edge:tester:tests_passed"
        - "edge:reviewer:review_approved"
      nodeVisits:
        planner: 1
        developer: 1
        tester: 1
        reviewer: 1
      edgeTraversals:
        "edge:planner:plan_ready": 1
        "edge:developer:implementation_ready": 1
        "edge:tester:tests_passed": 1
        "edge:reviewer:review_approved": 1

  - name: one-correction-loop-of-each-then-approved
    input:
      id: task-with-fixes
      description: >-
        tests fail once (developer fixes it), then review requests changes
        once (developer fixes it again), then everything passes
    script:
      - role: planner
        outcome: plan_ready
      - role: developer
        outcome: implementation_ready
      - role: tester
        outcome: tests_failed
      - role: developer
        outcome: implementation_ready
      - role: tester
        outcome: tests_passed
      - role: reviewer
        outcome: changes_requested
      - role: developer
        outcome: implementation_ready
      - role: tester
        outcome: tests_passed
      - role: reviewer
        outcome: review_approved
    expect:
      finalStatus: completed
      terminalNode: "node:terminal:completed"
      nodeVisits:
        planner: 1
        developer: 3
        tester: 3
        reviewer: 2
      edgeTraversals:
        "edge:tester:tests_failed": 1
        "edge:reviewer:changes_requested": 1
