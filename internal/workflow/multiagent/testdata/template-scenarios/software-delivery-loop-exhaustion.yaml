# software-delivery-loop-exhaustion.yaml proves the shipped template leaves its
# tester -> developer correction loop unlimited by default: this finite script
# ends in a role-script failure rather than a loop-budget exhaustion.
#
# Because this workflow reuses Phase 1's exact "tester" -> "developer" on
# "tests_failed" vocabulary, its stable edge ID (edge:tester:tests_failed)
# collides with the package's built-in LoopTesterToDeveloper constant, so the
# budget name below is the same backward-compatible "max_tester_to_developer_loops"
# slug Phase 1 always used, not a generic "max_edge:tester:tests_failed_loops"
# name (see supervisor_types.go's loopBudgetSlug).
workflow: ../../templates/software-delivery.yaml
scenarios:
  - name: tester-loop-remains-unlimited
    input:
      id: task-loop-exhaustion
      description: tests keep failing while the loop has no configured traversal budget
    script:
      - role: planner
        outcome: plan_ready
      - role: developer
        outcome: implementation_ready
      - role: tester
        outcome: tests_failed
      - role: developer
        outcome: implementation_ready
      - role: tester
        outcome: tests_failed
      - role: developer
        outcome: implementation_ready
      - role: tester
        outcome: tests_failed
    expect:
      finalStatus: failed
      nodeVisits:
        planner: 1
        developer: 4
        tester: 3
      edgeTraversals:
        "edge:tester:tests_failed": 3
